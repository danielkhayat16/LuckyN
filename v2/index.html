<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Hamizve</title><script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script><style>body{font-family:Arial,sans-serif;margin:0;background:#f7f5ef;color:#20302b}header{position:sticky;top:0;background:#fff;padding:12px;border-bottom:1px solid #ddd;z-index:4}.top{display:flex;justify-content:space-between;gap:8px;align-items:center}.lang,.nav{display:flex;gap:6px;overflow:auto}.nav{margin-top:9px}button{border:0;border-radius:10px;padding:9px 11px;background:#3f7b68;color:white;font-weight:700}.off,.alt{background:#e9f1ee;color:#20302b}.wrap{max-width:950px;margin:auto;padding:12px}.panel{display:none}.panel.on{display:block}.card{background:#fff;border:1px solid #e2e6e3;border-radius:16px;padding:13px;margin:9px 0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:9px}.row{display:flex;gap:7px;flex-wrap:wrap}.row>*{flex:1}input,select,textarea{width:100%;padding:10px;border:1px solid #ccd5d0;border-radius:10px}.pill{display:inline-block;padding:3px 7px;border-radius:99px;background:#edf3f0;font-size:.78rem;margin:2px}.ok{background:#e3f5e9;color:#2a633f}.warn{background:#fff0dc;color:#8b571b}.bad{background:#ffe5e5;color:#8f3333}.recipe{border:1px solid #e2e6e3;border-radius:13px;padding:12px;margin:8px 0}.muted{color:#6b7771;font-size:.84rem}.source{margin-top:8px;padding-top:8px;border-top:1px solid #eee}.source a{color:#3f7b68;font-weight:700;text-decoration:none}table{width:100%;border-collapse:collapse}td,th{padding:8px;border-bottom:1px solid #eee;text-align:start}@media(max-width:600px){.top{align-items:flex-start;flex-direction:column}.lang{width:100%}.lang button{flex:1}}</style></head><body><header><div class="top"><div><b id="title"></b><div class="muted" id="sub"></div></div><div class="lang"><button id="he" onclick="setLang('he')">עברית</button><button id="fr" class="off" onclick="setLang('fr')">Français</button></div></div><div class="nav" id="nav"></div></header><main class="wrap"><section id="home" class="panel on"><div class="grid"><div class="card"><h3 id="hStock"></h3><div id="summary"></div></div><div class="card"><h3 id="hSoon"></h3><div id="soon"></div></div></div><div class="card"><h3 id="hCook"></h3><div id="homeRecipes"></div></div><div class="card"><button onclick="go('receipt')" id="scanHome"></button> <button class="alt" onclick="go('stock')" id="manualHome"></button></div></section><section id="stock" class="panel"><div class="card"><h3 id="hAdd"></h3><div class="row"><input id="pname"><select id="zone"><option value="fridge"></option><option value="freezer"></option><option value="pantry"></option></select><input id="qty" type="number" step=".1"><select id="unit"><option value="unit"></option><option value="box"></option><option value="pack"></option><option value="kg">kg</option><option value="l">L</option></select><input id="expiry" type="date"><button onclick="addItem()" id="addBtn"></button></div></div><div class="card"><table><tbody id="stockBody"></tbody></table></div></section><section id="recipes" class="panel"><div class="card"><div class="row"><select id="kf" onchange="renderRecipes()"><option value="all"></option><option value="pareve"></option><option value="dairy"></option><option value="meat"></option></select><select id="rf" onchange="renderRecipes()"><option value="possible"></option><option value="one"></option><option value="all"></option></select></div><div id="recipeList"></div></div><div class="card"><h3 id="hSources"></h3><div id="sources"></div></div></section><section id="receipt" class="panel"><div class="card"><h3 id="hReceipt"></h3><input id="img" type="file" accept="image/*" capture="environment"><button onclick="scan()" id="readBtn"></button><p id="status" class="muted"></p></div><div class="card"><textarea id="txt" rows="9"></textarea><button onclick="parseTicket()" id="parseBtn"></button></div><div class="card" id="ticketResults"></div></section><section id="shopping" class="panel"><div class="card"><h3 id="hShopping"></h3><ul id="shoppingList"></ul></div></section></main><script>const T={he:{title:'המזווה שלי',sub:'מלאי, מתכונים וקניות למשפחה',tabs:['בית','מלאי','מתכונים','קבלה','קניות'],stock:'מה יש בבית?',soon:'צריך להשתמש בקרוב',cook:'אפשר להכין עכשיו',add:'הוספת מוצר',shopping:'רשימת קניות',fridge:'מקרר',freezer:'מקפיא',pantry:'מזווה',unit:'יחידה',box:'קופסה',pack:'חבילה',all:'הכל',pareve:'פרווה',dairy:'חלבי',meat:'בשרי',possible:'אפשר להכין עכשיו',one:'חסר מוצר אחד',made:'הכנתי את המתכון',source:'מקור',original:'למקור',missing:'חסר',none:'אין כרגע פריטים',scan:'📷 סריקת קבלה',manual:'✍️ הוספה ידנית',receipt:'סריקת קבלה',read:'קריאת הקבלה',parse:'זיהוי מוצרים',sources:'מקורות מתכונים'},fr:{title:'Mon garde-manger',sub:'Stock, recettes et courses pour la famille',tabs:['Accueil','Stock','Recettes','Ticket','Courses'],stock:'Ce qu’il y a à la maison',soon:'À utiliser bientôt',cook:'À cuisiner maintenant',add:'Ajouter un produit',shopping:'Liste de courses',fridge:'Frigo',freezer:'Congélateur',pantry:'Placard',unit:'pièce',box:'boîte',pack:'paquet',all:'Tout',pareve:'Parvé',dairy:'Laitier',meat:'Viande',possible:'Réalisables maintenant',one:'Il manque un produit',made:'J’ai fait cette recette',source:'Source',original:'Voir la source',missing:'Manque',none:'Rien pour le moment',scan:'📷 Scanner un ticket',manual:'✍️ Ajouter manuellement',receipt:'Scanner un ticket',read:'Lire le ticket',parse:'Reconnaître les produits',sources:'Sources de recettes'}};let lang=localStorage.getItem('hzlang')||'he';const K='hzv5';let db=JSON.parse(localStorage.getItem(K)||'null')||{items:[],shopping:[]};const sourcesData=[['Anael Cooking','https://www.instagram.com/anaelcooking/'],['Hanna For Kids','https://www.instagram.com/hannaforkids_/'],['Rahel in the Kitchen','https://www.instagram.com/rahelinthekitchen/']];const recipes=[{he:'סלט טונה וירקות',fr:'Salade thon-légumes',k:'pareve',src:'Hamizve',url:'',ing:[['טונה','thon',1,'box'],['מלפפונים','concombres',1,'unit'],['עגבניות','tomates',2,'unit']]},{he:'טוסט אבוקדו וביצה',fr:'Tartine avocat-œuf',k:'dairy',src:'Hamizve',url:'',ing:[['לחם','pain',2,'unit'],['אבוקדו','avocat',1,'unit'],['ביצים','œufs',1,'unit']]},{he:'קוסקוס לשבת',fr:'Couscous de Shabbat',k:'meat',src:'Hamizve',url:'',ing:[['קוסקוס','couscous',.5,'kg'],['בשר','viande',.8,'kg'],['גזר','carottes',3,'unit'],['תפוחי אדמה','pommes de terre',3,'unit']]},{he:'עוף ובטטה בתנור',fr:'Poulet et patate douce au four',k:'meat',src:'Anael Cooking',url:'https://www.instagram.com/anaelcooking/',ing:[['עוף','poulet',1,'kg'],['בטטה','patate douce',2,'unit'],['בצל','oignons',2,'unit']]},{he:'עוגת תפוזים מהירה',fr:'Cake express à l’orange',k:'pareve',src:'Rahel in the Kitchen',url:'https://www.instagram.com/rahelinthekitchen/',ing:[['ביצים','œufs',4,'unit'],['קמח','farine',2,'pack'],['שמן','huile',.5,'l'],['מיץ תפוזים','jus d’orange',.75,'l']]},{he:'סלט ארטישוק',fr:'Salade d’artichauts',k:'pareve',src:'Rahel in the Kitchen',url:'https://www.instagram.com/rahelinthekitchen/',ing:[['לבבות ארטישוק','cœurs d’artichaut',6,'unit'],['בצל','oignon',1,'unit'],['מיץ תפוזים','jus d’orange',1,'l']]}];const tabs=['home','stock','recipes','receipt','shopping'];tabs.forEach((id,i)=>{let b=document.createElement('button');b.onclick=()=>go(id);nav.appendChild(b)});function tr(k){return T[lang][k]||k}function setLang(l){lang=l;localStorage.setItem('hzlang',l);apply();render()}function apply(){document.documentElement.lang=lang;document.documentElement.dir=lang==='he'?'rtl':'ltr';title.textContent=tr('title');sub.textContent=tr('sub');he.className=lang==='he'?'':'off';fr.className=lang==='fr'?'':'off';[...nav.children].forEach((b,i)=>b.textContent=T[lang].tabs[i]);hStock.textContent=tr('stock');hSoon.textContent=tr('soon');hCook.textContent=tr('cook');hAdd.textContent=tr('add');hShopping.textContent=tr('shopping');hReceipt.textContent=tr('receipt');hSources.textContent=tr('sources');scanHome.textContent=tr('scan');manualHome.textContent=tr('manual');readBtn.textContent=tr('read');parseBtn.textContent=tr('parse');addBtn.textContent=tr('add');[...zone.options].forEach(o=>o.textContent=tr(o.value));[...unit.options].forEach(o=>o.textContent=tr(o.value));pname.placeholder=lang==='he'?'שם המוצר':'Nom du produit';qty.placeholder=lang==='he'?'כמות':'Quantité';let a=kf.options;a[0].textContent=tr('all');a[1].textContent=tr('pareve');a[2].textContent=tr('dairy');a[3].textContent=tr('meat');let f=rf.options;f[0].textContent=tr('possible');f[1].textContent=tr('one');f[2].textContent=tr('all')}function go(id){document.querySelectorAll('.panel').forEach(x=>x.classList.remove('on'));document.getElementById(id).classList.add('on');[...nav.children].forEach((b,i)=>b.className=tabs[i]===id?'':'off');render()}function save(){localStorage.setItem(K,JSON.stringify(db));render()}function n(s){return(s||'').trim().toLowerCase()}function addItem(){if(!pname.value||!qty.value)return;db.items.push({id:crypto.randomUUID(),name:pname.value,zone:zone.value,qty:+qty.value,unit:unit.value,expiry:expiry.value});pname.value=qty.value=expiry.value='';save()}function stockFor(a){return db.items.find(x=>(n(x.name)===n(a[0])||n(x.name)===n(a[1]))&&x.unit===a[3])}function missing(r){return r.ing.filter(a=>{let x=stockFor(a);return!x||x.qty<a[2]})}function useRecipe(i){let r=recipes[i];if(missing(r).length)return;r.ing.forEach(a=>{let x=stockFor(a);x.qty=Math.max(0,x.qty-a[2]);db.shopping.push({name:lang==='he'?a[0]:a[1],qty:a[2],unit:a[3]})});save()}function card(r,i){let m=missing(r),nm=lang==='he'?r.he:r.fr;return `<div class="recipe"><b>${nm}</b><div><span class="pill">${tr(r.k)}</span>${m.length?`<span class="pill warn">${tr('missing')} ${m.length}</span>`:`<span class="pill ok">${tr('possible')}</span>`}</div><div class="muted">${r.ing.map(a=>(lang==='he'?a[0]:a[1])+' '+a[2]+' '+(T[lang][a[3]]||a[3])).join(' • ')}</div>${m.length?'':`<button onclick="useRecipe(${i})">${tr('made')}</button>`}<div class="source"><b>${tr('source')}:</b> ${r.src}${r.url?` · <a href="${r.url}" target="_blank">${tr('original')}</a>`:''}</div></div>`}function renderRecipes(){recipeList.innerHTML='';recipes.forEach((r,i)=>{let m=missing(r);if(kf.value!=='all'&&r.k!==kf.value)return;if(rf.value==='possible'&&m.length)return;if(rf.value==='one'&&m.length!==1)return;recipeList.insertAdjacentHTML('beforeend',card(r,i))});if(!recipeList.innerHTML)recipeList.textContent=tr('none');sources.innerHTML=sourcesData.map(s=>`<div><a href="${s[1]}" target="_blank">${s[0]}</a></div>`).join('')}function days(d){return d?Math.ceil((new Date(d)-new Date())/86400000):null}function render(){summary.innerHTML=`🧊 ${tr('fridge')}: ${db.items.filter(x=>x.zone==='fridge').length}<br>❄️ ${tr('freezer')}: ${db.items.filter(x=>x.zone==='freezer').length}<br>🥫 ${tr('pantry')}: ${db.items.filter(x=>x.zone==='pantry').length}`;let e=db.items.filter(x=>days(x.expiry)!==null&&days(x.expiry)<=5);soon.innerHTML=e.length?e.map(x=>`<div>${x.name} <span class="pill ${days(x.expiry)<=2?'bad':'warn'}">${days(x.expiry)}j</span></div>`).join(''):tr('none');stockBody.innerHTML=db.items.map(x=>`<tr><td>${x.name}</td><td>${tr(x.zone)}</td><td>${x.qty} ${T[lang][x.unit]||x.unit}</td><td>${x.expiry||'—'}</td></tr>`).join('');let poss=recipes.map((r,i)=>[r,i]).filter(x=>missing(x[0]).length===0).slice(0,4);homeRecipes.innerHTML=poss.length?poss.map(x=>card(x[0],x[1])).join(''):tr('none');shoppingList.innerHTML=db.shopping.length?db.shopping.map(x=>`<li>${x.name} — ${x.qty} ${T[lang][x.unit]||x.unit}</li>`).join(''):`<li>${tr('none')}</li>`;renderRecipes()}async function scan(){let f=img.files[0];if(!f)return;status.textContent=lang==='he'?'קורא…':'Lecture…';try{let r=await Tesseract.recognize(f,'heb+eng');txt.value=r.data.text;status.textContent='OK'}catch(e){status.textContent='OCR error'}}function parseTicket(){let lines=txt.value.split('\n').filter(Boolean);ticketResults.innerHTML=lines.slice(0,40).map(l=>`<div class="muted">${l}</div>`).join('')}apply();render();</script></body></html>
