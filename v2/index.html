<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Hamizve</title><style>:root{--bg:#f7f6f2;--card:#fff;--ink:#20302b;--muted:#6b7771;--accent:#3f7b68;--soft:#eaf2ee;--line:#e1e7e3;--warn:#fff0dc}*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;background:var(--bg);color:var(--ink)}header{position:sticky;top:0;z-index:5;background:#ffffffef;border-bottom:1px solid var(--line);backdrop-filter:blur(10px)}.top,.wrap{max-width:980px;margin:auto;padding:12px}.top{display:flex;justify-content:space-between;align-items:center;gap:10px}.nav{display:flex;gap:6px;overflow:auto;padding-top:8px}.nav button{white-space:nowrap}button{border:0;border-radius:12px;padding:11px 13px;background:var(--accent);color:#fff;font-weight:700}.alt{background:var(--soft);color:var(--ink)}.panel{display:none}.panel.on{display:block}.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:15px;margin:10px 0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:10px}.field{display:flex;flex-direction:column;gap:6px;margin:8px 0}.field label{font-weight:700}input,select{width:100%;min-height:50px;padding:12px;border:1px solid #ccd6d0;border-radius:12px;font-size:1rem}.pill{display:inline-block;padding:4px 8px;border-radius:999px;background:#edf3f0;font-size:.78rem;margin:2px}.ok{background:#e4f5ea;color:#28623e}.warn{background:var(--warn);color:#89551b}.recipe{border:1px solid var(--line);border-radius:14px;padding:12px;margin:8px 0}.muted{color:var(--muted);font-size:.86rem}.source{margin-top:8px;padding-top:8px;border-top:1px solid #eee}.onboard{position:fixed;inset:0;background:rgba(20,31,27,.48);z-index:50;display:none;align-items:center;justify-content:center;padding:14px}.onboard.show{display:flex}.wizard{background:#fff;width:min(620px,100%);max-height:92vh;overflow:auto;border-radius:22px;padding:20px}.choice-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}.choice{border:1px solid var(--line);background:#fff;color:var(--ink);padding:14px}.choice.sel{background:var(--accent);color:#fff}.chips{display:flex;flex-wrap:wrap;gap:8px}.chip{background:#f1f5f2;color:var(--ink)}.chip.sel{background:var(--accent);color:#fff}.hidden{display:none}@media(max-width:650px){.top{flex-direction:column;align-items:flex-start}.grid,.choice-grid{grid-template-columns:1fr}.field input,.field select{font-size:1.05rem}}</style></head><body><div id="onboard" class="onboard"><div class="wizard"><div id="step1"><h2>Bienvenue / ברוכים הבאים</h2><p class="muted">Choisissez la langue principale de votre application.</p><div class="choice-grid"><button class="choice" onclick="chooseLang('fr')">🇫🇷 Français</button><button class="choice" onclick="chooseLang('he')">🇮🇱 עברית</button></div></div><div id="step2" class="hidden"><h2 id="famTitle"></h2><div class="field"><label id="familyLabel"></label><input id="familyName"></div><div class="field"><label id="firstLabel"></label><input id="firstName"></div><div class="grid"><div class="field"><label id="adultsLabel"></label><input id="adults" type="number" min="1" value="2"></div><div class="field"><label id="kidsLabel"></label><input id="kids" type="number" min="0" value="0"></div></div><button onclick="nextPrefs()" id="continueBtn"></button></div><div id="step3" class="hidden"><h2 id="prefTitle"></h2><p class="muted" id="prefHelp"></p><div id="prefs" class="chips"></div><div class="field"><label id="timeLabel"></label><select id="cookTime"><option value="quick"></option><option value="medium"></option><option value="long"></option></select></div><button onclick="finishOnboarding()" id="finishBtn"></button></div></div></div><header><div class="top"><div><b id="title"></b><div class="muted" id="subtitle"></div></div><button class="alt" onclick="resetProfile()" id="profileBtn"></button></div><div class="top" style="padding-top:0"><div class="nav" id="nav"></div></div></header><main class="wrap"><section id="home" class="panel on"><div class="grid"><div class="card"><h3 id="hello"></h3><div id="summary"></div></div><div class="card"><h3 id="soonTitle"></h3><div id="soon"></div></div></div><div class="card"><h3 id="cookNowTitle"></h3><div id="cookNow"></div></div><div class="card"><h3 id="ideasTitle"></h3><div id="ideas"></div></div></section><section id="stock" class="panel"><div class="card"><h3 id="addTitle"></h3><div class="grid"><div class="field"><label id="nameLabel"></label><input id="pname"></div><div class="field"><label id="placeLabel"></label><select id="zone"><option value="fridge"></option><option value="freezer"></option><option value="pantry"></option></select></div><div class="field"><label id="qtyLabel"></label><input id="qty" type="number" step=".1"></div><div class="field"><label id="unitLabel"></label><select id="unit"><option value="unit"></option><option value="box"></option><option value="pack"></option><option value="kg">kg</option><option value="l">L</option></select></div></div><button onclick="addItem()" id="addBtn"></button></div><div class="card"><h3 id="inventoryTitle"></h3><div id="inventory"></div></div></section><section id="recipes" class="panel"><div class="card"><h3 id="recipesTitle"></h3><div id="allRecipes"></div></div></section><section id="shopping" class="panel"><div class="card"><h3 id="shoppingTitle"></h3><ul id="shopping"></ul></div></section><section id="family" class="panel"><div class="card"><h3 id="familySectionTitle"></h3><div id="familyInfo"></div><p class="muted" id="syncNote"></p></div></section></main><script>const T={fr:{title:'Mon garde-manger',tabs:['Accueil','Stock','Recettes','Courses','Famille'],hello:'Bonjour',soon:'À utiliser bientôt',cook:'Je peux cuisiner maintenant',ideas:'Idées adaptées à vos goûts et à votre stock',add:'Ajouter un produit',inventory:'Mon stock',recipes:'Recettes',shopping:'Liste de courses',family:'Ma famille',profile:'Profil',fridge:'Frigo',freezer:'Congélateur',pantry:'Placard',unit:'pièce',box:'boîte',pack:'paquet',name:'Nom de l’ingrédient',place:'Où est-il rangé ?',qty:'Quantité',unitLbl:'Unité',addBtn:'Ajouter au stock',none:'Rien pour le moment',source:'Source',missing:'Manque',possible:'Possible maintenant',famTitle:'Créons votre foyer',familyLabel:'Nom de famille / nom du foyer',firstLabel:'Votre prénom',adultsLabel:'Adultes',kidsLabel:'Enfants',continue:'Continuer',prefTitle:'Qu’aimez-vous manger ?',prefHelp:'Choisissez plusieurs styles. Ils seront proposés en priorité.',timeLabel:'Temps de cuisine préféré',quick:'Rapide (10–20 min)',medium:'30–45 min',long:'J’aime cuisiner longtemps',finish:'Créer mon espace',sync:'Le partage temps réel avec un conjoint nécessite la prochaine étape serveur. Votre profil famille est déjà prêt.',prefs:{quick:'Recettes rapides',family:'Repas familiaux',kids:'Enfants',couple:'En amoureux',shabbat:'Shabbat',light:'Repas légers',baking:'Pâtisserie',fish:'Poisson',meat:'Viande',dairy:'Laitier'}},he:{title:'המזווה שלי',tabs:['בית','מלאי','מתכונים','קניות','משפחה'],hello:'שלום',soon:'צריך להשתמש בקרוב',cook:'אפשר להכין עכשיו',ideas:'רעיונות לפי הטעם והמלאי שלכם',add:'הוספת מוצר',inventory:'המלאי שלי',recipes:'מתכונים',shopping:'רשימת קניות',family:'המשפחה שלי',profile:'פרופיל',fridge:'מקרר',freezer:'מקפיא',pantry:'מזווה',unit:'יחידה',box:'קופסה',pack:'חבילה',name:'שם המוצר',place:'איפה נמצא?',qty:'כמות',unitLbl:'יחידת מידה',addBtn:'הוספה למלאי',none:'אין כרגע פריטים',source:'מקור',missing:'חסר',possible:'אפשר להכין',famTitle:'בואו ניצור את הבית שלכם',familyLabel:'שם המשפחה / הבית',firstLabel:'השם הפרטי שלכם',adultsLabel:'מבוגרים',kidsLabel:'ילדים',continue:'המשך',prefTitle:'מה אתם אוהבים לאכול?',prefHelp:'אפשר לבחור כמה סגנונות. הם יקבלו עדיפות בהמלצות.',timeLabel:'כמה זמן אתם אוהבים לבשל?',quick:'מהיר (10–20 דקות)',medium:'30–45 דקות',long:'אני אוהב/ת לבשל הרבה זמן',finish:'יצירת המרחב שלי',sync:'שיתוף בזמן אמת עם בן/בת הזוג דורש את שלב השרת הבא. פרופיל המשפחה כבר מוכן.',prefs:{quick:'מתכונים מהירים',family:'ארוחות משפחתיות',kids:'ילדים',couple:'זוגי',shabbat:'שבת',light:'ארוחות קלות',baking:'אפייה',fish:'דגים',meat:'בשרי',dairy:'חלבי'}}};const ING={milk:{fr:'Lait',he:'חלב',a:['lait','milk','חלב']},egg:{fr:'Œufs',he:'ביצים',a:['oeuf','oeufs','œuf','œufs','ביצה','ביצים']},tomato:{fr:'Tomates',he:'עגבניות',a:['tomate','tomates','עגבניה','עגבניות']},pita:{fr:'Pitas',he:'פיתות',a:['pita','pitas','pitot','pitotes','פיתה','פיתות']},cheese:{fr:'Fromage',he:'גבינה',a:['fromage','גבינה']},tuna:{fr:'Thon',he:'טונה',a:['thon','טונה']},cucumber:{fr:'Concombres',he:'מלפפונים',a:['concombre','concombres','מלפפון','מלפפונים']},avocado:{fr:'Avocat',he:'אבוקדו',a:['avocat','avocats','אבוקדו']},bread:{fr:'Pain',he:'לחם',a:['pain','לחם']},salmon:{fr:'Saumon',he:'סלמון',a:['saumon','סלמון']},rice:{fr:'Riz',he:'אורז',a:['riz','אורז']},chicken:{fr:'Poulet',he:'עוף',a:['poulet','עוף']}};const RECIPES=[{fr:'Pita omelette-tomates',he:'פיתה עם חביתה ועגבניות',tags:['quick','family','kids'],src:'Hamizve',ing:[['egg',2,'unit'],['tomato',1,'unit'],['pita',1,'unit']]},{fr:'Shakshuka express',he:'שקשוקה מהירה',tags:['quick','family'],src:'Hamizve',ing:[['egg',2,'unit'],['tomato',3,'unit']]},{fr:'Salade tomates-œufs',he:'סלט עגבניות וביצים',tags:['quick','light'],src:'Hamizve',ing:[['egg',2,'unit'],['tomato',2,'unit']]},{fr:'Pita œuf dur-tomate',he:'פיתה עם ביצה קשה ועגבנייה',tags:['quick','kids'],src:'Hamizve',ing:[['pita',1,'unit'],['egg',1,'unit'],['tomato',1,'unit']]},{fr:'Tartine avocat-œuf',he:'טוסט אבוקדו וביצה',tags:['quick','light','couple'],src:'Hamizve',ing:[['bread',2,'unit'],['avocado',1,'unit'],['egg',1,'unit']]},{fr:'Salade thon-légumes',he:'סלט טונה וירקות',tags:['quick','light','fish'],src:'Hamizve',ing:[['tuna',1,'box'],['cucumber',1,'unit'],['tomato',2,'unit']]},{fr:'Riz au saumon',he:'אורז עם סלמון',tags:['family','fish'],src:'Hamizve',ing:[['rice',1,'pack'],['salmon',1,'pack']]},{fr:'Poulet familial',he:'עוף משפחתי',tags:['family','meat','shabbat'],src:'Hamizve',ing:[['chicken',1,'kg']]}];let profile=JSON.parse(localStorage.getItem('hz_profile')||'null');let lang=profile?.lang||'fr';let db=JSON.parse(localStorage.getItem('hzv5')||'null')||{items:[],shopping:[]};function norm(s){return(s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').trim()}function canon(s){let q=norm(s);for(const[k,v]of Object.entries(ING))if(v.a.some(a=>norm(a)===q))return k;return q}db.items.forEach(x=>{if(!x.key)x.key=canon(x.name)});const tabs=['home','stock','recipes','shopping','family'];tabs.forEach(id=>{let b=document.createElement('button');b.onclick=()=>go(id);nav.appendChild(b)});function tr(k){return T[lang][k]||k}function label(key){return ING[key]?.[lang]||key}function chooseLang(l){lang=l;step1.classList.add('hidden');step2.classList.remove('hidden');renderOnboardingText()}function renderOnboardingText(){famTitle.textContent=tr('famTitle');familyLabel.textContent=tr('familyLabel');firstLabel.textContent=tr('firstLabel');adultsLabel.textContent=tr('adultsLabel');kidsLabel.textContent=tr('kidsLabel');continueBtn.textContent=tr('continue');prefTitle.textContent=tr('prefTitle');prefHelp.textContent=tr('prefHelp');timeLabel.textContent=tr('timeLabel');cookTime.options[0].textContent=tr('quick');cookTime.options[1].textContent=tr('medium');cookTime.options[2].textContent=tr('long');finishBtn.textContent=tr('finish');prefs.innerHTML='';Object.entries(T[lang].prefs).forEach(([k,v])=>{let b=document.createElement('button');b.className='chip';b.textContent=v;b.dataset.key=k;b.onclick=()=>b.classList.toggle('sel');prefs.appendChild(b)})}function nextPrefs(){if(!familyName.value.trim())return;step2.classList.add('hidden');step3.classList.remove('hidden');renderOnboardingText()}function finishOnboarding(){profile={lang,family:familyName.value.trim(),first:firstName.value.trim(),adults:+adults.value||1,kids:+kids.value||0,prefs:[...prefs.querySelectorAll('.sel')].map(x=>x.dataset.key),cookTime:cookTime.value};localStorage.setItem('hz_profile',JSON.stringify(profile));onboard.classList.remove('show');apply();render()}function resetProfile(){localStorage.removeItem('hz_profile');location.reload()}function apply(){document.documentElement.lang=lang;document.documentElement.dir=lang==='he'?'rtl':'ltr';title.textContent=tr('title');subtitle.textContent=profile?`${profile.family}`:'';profileBtn.textContent=tr('profile');[...nav.children].forEach((b,i)=>b.textContent=T[lang].tabs[i]);hello.textContent=`${tr('hello')}${profile?.first?' '+profile.first:''}`;soonTitle.textContent=tr('soon');cookNowTitle.textContent=tr('cook');ideasTitle.textContent=tr('ideas');addTitle.textContent=tr('add');inventoryTitle.textContent=tr('inventory');recipesTitle.textContent=tr('recipes');shoppingTitle.textContent=tr('shopping');familySectionTitle.textContent=tr('family');nameLabel.textContent=tr('name');placeLabel.textContent=tr('place');qtyLabel.textContent=tr('qty');unitLabel.textContent=tr('unitLbl');addBtn.textContent=tr('addBtn');[...zone.options].forEach(o=>o.textContent=tr(o.value));[...unit.options].forEach(o=>o.textContent=tr(o.value));pname.placeholder=lang==='he'?'לדוגמה: חלב':'Ex. : lait'}function go(id){document.querySelectorAll('.panel').forEach(x=>x.classList.remove('on'));document.getElementById(id).classList.add('on')}function addItem(){if(!pname.value.trim()||!qty.value)return;let key=canon(pname.value);let x=db.items.find(i=>i.key===key&&i.zone===zone.value&&i.unit===unit.value);if(x)x.qty+=+qty.value;else db.items.push({id:crypto.randomUUID(),name:pname.value,key,zone:zone.value,qty:+qty.value,unit:unit.value});pname.value='';qty.value='';save()}function save(){localStorage.setItem('hzv5',JSON.stringify(db));render()}function hasIng(a){let x=db.items.find(i=>i.key===a[0]&&i.unit===a[2]);return x&&x.qty>=a[1]}function missing(r){return r.ing.filter(a=>!hasIng(a))}function score(r){let s=r.ing.filter(a=>db.items.some(i=>i.key===a[0]&&i.qty>0)).length*10;if(profile)profile.prefs.forEach(p=>{if(r.tags.includes(p))s+=3});return s}function card(r){let m=missing(r);return `<div class="recipe"><b>${r[lang]}</b><div>${m.length?`<span class="pill warn">${tr('missing')} ${m.length}</span>`:`<span class="pill ok">${tr('possible')}</span>`}</div><div class="muted">${r.ing.map(a=>`${label(a[0])} ${a[1]} ${T[lang][a[2]]||a[2]}`).join(' • ')}</div><div class="source"><b>${tr('source')}:</b> ${r.src}</div></div>`}function render(){summary.innerHTML=`🧊 ${tr('fridge')}: ${db.items.filter(x=>x.zone==='fridge').length}<br>❄️ ${tr('freezer')}: ${db.items.filter(x=>x.zone==='freezer').length}<br>🥫 ${tr('pantry')}: ${db.items.filter(x=>x.zone==='pantry').length}`;soon.textContent=tr('none');let possible=RECIPES.filter(r=>missing(r).length===0).sort((a,b)=>score(b)-score(a));cookNow.innerHTML=possible.length?possible.map(card).join(''):tr('none');let rec=RECIPES.filter(r=>missing(r).length>0&&score(r)>0).sort((a,b)=>score(b)-score(a)).slice(0,6);ideas.innerHTML=rec.length?rec.map(card).join(''):tr('none');inventory.innerHTML=db.items.length?db.items.map(x=>`<div class="recipe"><b>${label(x.key)}</b><div class="muted">${tr(x.zone)} · ${x.qty} ${T[lang][x.unit]||x.unit}</div></div>`).join(''):tr('none');allRecipes.innerHTML=RECIPES.sort((a,b)=>score(b)-score(a)).map(card).join('');shopping.innerHTML=db.shopping.length?db.shopping.map(x=>`<li>${label(x.key)} ${x.qty}</li>`).join(''):`<li>${tr('none')}</li>`;familyInfo.innerHTML=profile?`<p><b>${profile.family}</b></p><p>${profile.adults} ${lang==='he'?'מבוגרים':'adultes'} · ${profile.kids} ${lang==='he'?'ילדים':'enfants'}</p><p>${profile.prefs.map(p=>T[lang].prefs[p]).join(' · ')}</p>`:'';syncNote.textContent=tr('sync')}if(!profile){onboard.classList.add('show')}apply();render();</script></body></html>
