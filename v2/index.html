<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Hamizve</title>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
<style>
:root{--bg:#f7f6f2;--card:#fff;--ink:#20302b;--muted:#6b7771;--accent:#3f7b68;--soft:#eaf2ee;--line:#e1e7e3;--warn:#fff0dc;--warntext:#8b571b;--bad:#ffe5e5;--badtext:#8f3333}
*{box-sizing:border-box}body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;margin:0;background:var(--bg);color:var(--ink)}
header{position:sticky;top:0;background:#ffffffef;backdrop-filter:blur(10px);padding:12px;border-bottom:1px solid var(--line);z-index:10}
.top{display:flex;justify-content:space-between;gap:10px;align-items:center;max-width:980px;margin:auto}.brand b{font-size:1.25rem}.muted{color:var(--muted);font-size:.86rem}
.lang,.nav{display:flex;gap:6px}.nav{max-width:980px;margin:10px auto 0;overflow:auto}.nav button{white-space:nowrap}
button{border:0;border-radius:11px;padding:10px 12px;background:var(--accent);color:#fff;font-weight:700;font-size:.95rem}button.alt,.nav button.off,.lang button.off{background:var(--soft);color:var(--ink)}
.wrap{max-width:980px;margin:auto;padding:12px}.panel{display:none}.panel.on{display:block}.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:15px;margin:10px 0;box-shadow:0 3px 14px rgba(0,0,0,.03)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:10px}.form-grid{display:grid;grid-template-columns:2fr 1fr 1fr;gap:12px}.field{display:flex;flex-direction:column;gap:6px}.field label{font-weight:700;font-size:.92rem}
input,select,textarea{width:100%;padding:13px 12px;border:1px solid #cbd6d0;border-radius:12px;background:#fff;font-size:1rem;min-height:48px}.add-wide{width:100%;margin-top:12px;padding:13px}
.pill{display:inline-block;padding:4px 8px;border-radius:999px;background:#edf3f0;font-size:.78rem;margin:2px}.ok{background:#e3f5e9;color:#2a633f}.warn{background:var(--warn);color:var(--warntext)}.bad{background:var(--bad);color:var(--badtext)}
.recipe{border:1px solid var(--line);border-radius:15px;padding:13px;margin:9px 0}.recipe-title{font-size:1.05rem;font-weight:800}.source{margin-top:9px;padding-top:8px;border-top:1px solid #eee;font-size:.84rem;color:var(--muted)}.source a{color:var(--accent);font-weight:700;text-decoration:none}
table{width:100%;border-collapse:collapse}td,th{padding:10px 6px;border-bottom:1px solid #eee;text-align:start}.stock-mobile{display:none}.section-title{margin:0 0 8px;font-size:1.08rem}
@media(max-width:700px){.top{align-items:flex-start;flex-direction:column}.lang{width:100%}.lang button{flex:1}.form-grid{grid-template-columns:1fr}.field{width:100%}input,select{font-size:1.05rem;min-height:52px}table{display:none}.stock-mobile{display:block}.stock-item{background:#fafbf9;border:1px solid var(--line);border-radius:13px;padding:11px;margin:8px 0}}
</style></head>
<body>
<header><div class="top"><div class="brand"><b id="title"></b><div class="muted" id="sub"></div></div><div class="lang"><button id="he" onclick="setLang('he')">עברית</button><button id="fr" class="off" onclick="setLang('fr')">Français</button></div></div><div class="nav" id="nav"></div></header>
<main class="wrap">
<section id="home" class="panel on">
<div class="grid"><div class="card"><h3 class="section-title" id="hStock"></h3><div id="summary"></div></div><div class="card"><h3 class="section-title" id="hSoon"></h3><div id="soon"></div></div></div>
<div class="card"><h3 class="section-title" id="hCook"></h3><div id="homeRecipes"></div></div>
<div class="card"><h3 class="section-title" id="hIdeas"></h3><div id="smartIdeas"></div></div>
<div class="card"><button onclick="go('receipt')" id="scanHome"></button> <button class="alt" onclick="go('stock')" id="manualHome"></button></div>
</section>
<section id="stock" class="panel">
<div class="card"><h3 class="section-title" id="hAdd"></h3><div class="form-grid">
<div class="field"><label id="lblName"></label><input id="pname" autocomplete="off"></div>
<div class="field"><label id="lblPlace"></label><select id="zone"><option value="fridge"></option><option value="freezer"></option><option value="pantry"></option></select></div>
<div class="field"><label id="lblQty"></label><input id="qty" type="number" step=".1" inputmode="decimal"></div>
<div class="field"><label id="lblUnit"></label><select id="unit"><option value="unit"></option><option value="box"></option><option value="pack"></option><option value="kg">kg</option><option value="g">g</option><option value="l">L</option><option value="ml">ml</option></select></div>
<div class="field"><label id="lblPurchase"></label><input id="purchase" type="date"></div>
<div class="field"><label id="lblExpiry"></label><input id="expiry" type="date"></div>
</div><button class="add-wide" onclick="addItem()" id="addBtn"></button></div>
<div class="card"><h3 class="section-title" id="hInventory"></h3><table><thead><tr><th id="thName"></th><th id="thPlace"></th><th id="thQty"></th><th id="thExpiry"></th></tr></thead><tbody id="stockBody"></tbody></table><div id="stockMobile" class="stock-mobile"></div></div>
</section>
<section id="recipes" class="panel">
<div class="card"><div class="form-grid" style="grid-template-columns:1fr 1fr">
<div class="field"><label id="lblKosher"></label><select id="kf" onchange="renderRecipes()"><option value="all"></option><option value="pareve"></option><option value="dairy"></option><option value="meat"></option></select></div>
<div class="field"><label id="lblRecipeFilter"></label><select id="rf" onchange="renderRecipes()"><option value="possible"></option><option value="one"></option><option value="all"></option></select></div>
</div><div id="recipeList"></div></div>
<div class="card"><h3 id="hSources"></h3><div id="sources"></div></div>
</section>
<section id="receipt" class="panel"><div class="card"><h3 id="hReceipt"></h3><input id="img" type="file" accept="image/*" capture="environment"><button class="add-wide" onclick="scan()" id="readBtn"></button><p id="status" class="muted"></p></div><div class="card"><textarea id="txt" rows="9"></textarea><button class="add-wide" onclick="parseTicket()" id="parseBtn"></button></div><div class="card" id="ticketResults"></div></section>
<section id="shopping" class="panel"><div class="card"><h3 id="hShopping"></h3><ul id="shoppingList"></ul></div></section>
</main>
<script>
const T={he:{title:'המזווה שלי',sub:'מלאי, מתכונים וקניות למשפחה',tabs:['בית','מלאי','מתכונים','קבלה','קניות'],stock:'מה יש בבית?',soon:'צריך להשתמש בקרוב',cook:'אפשר להכין עכשיו',ideas:'רעיונות לפי מה שכבר יש בבית',add:'הוספת מוצר',inventory:'המלאי שלי',shopping:'רשימת קניות',fridge:'מקרר',freezer:'מקפיא',pantry:'מזווה',unit:'יחידה',box:'קופסה',pack:'חבילה',all:'הכל',pareve:'פרווה',dairy:'חלבי',meat:'בשרי',possible:'אפשר להכין עכשיו',one:'חסר מוצר אחד',made:'הכנתי את המתכון',source:'מקור',original:'למקור',missing:'חסר',none:'אין כרגע פריטים',scan:'📷 סריקת קבלה',manual:'✍️ הוספה ידנית',receipt:'סריקת קבלה',read:'קריאת הקבלה',parse:'זיהוי מוצרים',sources:'מקורות מתכונים',name:'שם המוצר',place:'איפה נמצא?',qty:'כמות',unitLbl:'יחידת מידה',purchase:'תאריך קנייה',expiry:'תאריך תפוגה',kosher:'סוג כשרות',filter:'סינון מתכונים',product:'מוצר',quantity:'כמות'},
fr:{title:'Mon garde-manger',sub:'Stock, recettes et courses pour la famille',tabs:['Accueil','Stock','Recettes','Ticket','Courses'],stock:'Ce qu’il y a à la maison',soon:'À utiliser bientôt',cook:'Je peux cuisiner maintenant',ideas:'Idées adaptées à ce que j’ai déjà',add:'Ajouter un produit',inventory:'Mon stock',shopping:'Liste de courses',fridge:'Frigo',freezer:'Congélateur',pantry:'Placard',unit:'pièce',box:'boîte',pack:'paquet',all:'Tout',pareve:'Parvé',dairy:'Laitier',meat:'Viande',possible:'Réalisables maintenant',one:'Il manque un produit',made:'J’ai fait cette recette',source:'Source',original:'Voir la source',missing:'Manque',none:'Rien pour le moment',scan:'📷 Scanner un ticket',manual:'✍️ Ajouter manuellement',receipt:'Scanner un ticket',read:'Lire le ticket',parse:'Reconnaître les produits',sources:'Sources de recettes',name:'Nom de l’ingrédient',place:'Où est-il rangé ?',qty:'Quantité',unitLbl:'Unité',purchase:'Date d’achat',expiry:'Date de péremption',kosher:'Type de recette',filter:'Filtre recettes',product:'Produit',quantity:'Quantité'}};
const ING={
egg:{fr:'Œufs',he:'ביצים',a:['oeuf','oeufs','œuf','œufs','egg','eggs','ביצה','ביצים']},
tomato:{fr:'Tomates',he:'עגבניות',a:['tomate','tomates','tomato','tomatoes','עגבניה','עגבניות','עגבנייה']},
pita:{fr:'Pitas',he:'פיתות',a:['pita','pitas','pitot','pitotes','פיתה','פיתות']},
cucumber:{fr:'Concombres',he:'מלפפונים',a:['concombre','concombres','cucumber','cucumbers','מלפפון','מלפפונים']},
tuna:{fr:'Thon',he:'טונה',a:['thon','tuna','טונה']},
cheese:{fr:'Fromage',he:'גבינה',a:['fromage','cheese','גבינה','גבינות']},
avocado:{fr:'Avocat',he:'אבוקדו',a:['avocat','avocats','avocado','אבוקדו']},
bread:{fr:'Pain',he:'לחם',a:['pain','bread','לחם']},
onion:{fr:'Oignons',he:'בצל',a:['oignon','oignons','onion','onions','בצל','בצלים']},
potato:{fr:'Pommes de terre',he:'תפוחי אדמה',a:['pomme de terre','pommes de terre','potato','potatoes','תפוח אדמה','תפוחי אדמה']},
sweetpotato:{fr:'Patates douces',he:'בטטות',a:['patate douce','patates douces','sweet potato','בטטה','בטטות']},
chicken:{fr:'Poulet',he:'עוף',a:['poulet','chicken','עוף']},
salmon:{fr:'Saumon',he:'סלמון',a:['saumon','salmon','סלמון']},
rice:{fr:'Riz',he:'אורז',a:['riz','rice','אורז']},
pasta:{fr:'Pâtes',he:'פסטה',a:['pates','pâtes','pasta','פסטה']},
flour:{fr:'Farine',he:'קמח',a:['farine','flour','קמח']},
oil:{fr:'Huile',he:'שמן',a:['huile','oil','שמן']},
milk:{fr:'Lait',he:'חלב',a:['lait','milk','חלב']},
corn:{fr:'Maïs',he:'תירס',a:['mais','maïs','corn','תירס']},
mushroom:{fr:'Champignons',he:'פטריות',a:['champignon','champignons','mushroom','mushrooms','פטריה','פטריות']}
};
function norm(s){return (s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[״"]/g,'').trim()}
function canon(s){let q=norm(s);for(const[k,v]of Object.entries(ING))if(v.a.some(a=>norm(a)===q))return k;return q}
function ingLabel(key){return ING[key]?.[lang]||key}
let lang=localStorage.getItem('hzlang')||'he';const K='hzv5';let db=JSON.parse(localStorage.getItem(K)||'null')||{items:[],shopping:[]};
function migrateItems(){db.items.forEach(x=>{if(!x.key)x.key=canon(x.name)});localStorage.setItem(K,JSON.stringify(db))}
migrateItems();
const sourcesData=[['Anael Cooking','https://www.instagram.com/anaelcooking/'],['Hanna For Kids','https://www.instagram.com/hannaforkids_/'],['Rahel in the Kitchen','https://www.instagram.com/rahelinthekitchen/']];
const recipes=[
{he:'פיתה עם חביתה ועגבניות',fr:'Pita omelette-tomates',k:'pareve',src:'Hamizve',url:'',ing:[['egg',2,'unit'],['tomato',1,'unit'],['pita',1,'unit']]},
{he:'שקשוקה מהירה',fr:'Shakshuka express',k:'pareve',src:'Hamizve',url:'',ing:[['egg',2,'unit'],['tomato',3,'unit']]},
{he:'סלט עגבניות וביצים',fr:'Salade tomates-œufs',k:'pareve',src:'Hamizve',url:'',ing:[['egg',2,'unit'],['tomato',2,'unit']]},
{he:'פיתה עם ביצה קשה ועגבנייה',fr:'Pita œuf dur-tomate',k:'pareve',src:'Hamizve',url:'',ing:[['pita',1,'unit'],['egg',1,'unit'],['tomato',1,'unit']]},
{he:'טוסט אבוקדו וביצה',fr:'Tartine avocat-œuf',k:'dairy',src:'Hamizve',url:'',ing:[['bread',2,'unit'],['avocado',1,'unit'],['egg',1,'unit'],['cheese',1,'pack']]},
{he:'סלט טונה וירקות',fr:'Salade thon-légumes',k:'pareve',src:'Hamizve',url:'',ing:[['tuna',1,'box'],['cucumber',1,'unit'],['tomato',2,'unit']]},
{he:'אורז עם סלמון',fr:'Riz au saumon',k:'pareve',src:'Hamizve',url:'',ing:[['rice',.2,'kg'],['salmon',.3,'kg'],['cucumber',1,'unit']]},
{he:'פסטה ברוטב עגבניות',fr:'Pâtes sauce tomate',k:'pareve',src:'Hamizve',url:'',ing:[['pasta',1,'pack'],['tomato',4,'unit'],['onion',1,'unit']]},
{he:'חביתה עם עגבניות',fr:'Omelette aux tomates',k:'pareve',src:'Hamizve',url:'',ing:[['egg',2,'unit'],['tomato',1,'unit']]},
{he:'עוף ובטטה בתנור',fr:'Poulet et patate douce au four',k:'meat',src:'Anael Cooking',url:'https://www.instagram.com/anaelcooking/',ing:[['chicken',1,'kg'],['sweetpotato',2,'unit'],['onion',2,'unit']]}
];
const tabs=['home','stock','recipes','receipt','shopping'];tabs.forEach((id,i)=>{let b=document.createElement('button');b.onclick=()=>go(id);nav.appendChild(b)});
function tr(k){return T[lang][k]||k}
function setLang(l){lang=l;localStorage.setItem('hzlang',l);apply();render()}
function apply(){document.documentElement.lang=lang;document.documentElement.dir=lang==='he'?'rtl':'ltr';title.textContent=tr('title');sub.textContent=tr('sub');he.className=lang==='he'?'':'off';fr.className=lang==='fr'?'':'off';[...nav.children].forEach((b,i)=>b.textContent=T[lang].tabs[i]);hStock.textContent=tr('stock');hSoon.textContent=tr('soon');hCook.textContent=tr('cook');hIdeas.textContent=tr('ideas');hAdd.textContent=tr('add');hInventory.textContent=tr('inventory');hShopping.textContent=tr('shopping');hReceipt.textContent=tr('receipt');hSources.textContent=tr('sources');scanHome.textContent=tr('scan');manualHome.textContent=tr('manual');readBtn.textContent=tr('read');parseBtn.textContent=tr('parse');addBtn.textContent=tr('add');lblName.textContent=tr('name');lblPlace.textContent=tr('place');lblQty.textContent=tr('qty');lblUnit.textContent=tr('unitLbl');lblPurchase.textContent=tr('purchase');lblExpiry.textContent=tr('expiry');lblKosher.textContent=tr('kosher');lblRecipeFilter.textContent=tr('filter');thName.textContent=tr('product');thPlace.textContent=tr('place');thQty.textContent=tr('quantity');thExpiry.textContent=tr('expiry');[...zone.options].forEach(o=>o.textContent=tr(o.value));[...unit.options].forEach(o=>o.textContent=tr(o.value));pname.placeholder=lang==='he'?'לדוגמה: חלב':'Ex. : lait';qty.placeholder=lang==='he'?'לדוגמה: 2':'Ex. : 2';let a=kf.options;a[0].textContent=tr('all');a[1].textContent=tr('pareve');a[2].textContent=tr('dairy');a[3].textContent=tr('meat');let f=rf.options;f[0].textContent=tr('possible');f[1].textContent=tr('one');f[2].textContent=tr('all')}
function go(id){document.querySelectorAll('.panel').forEach(x=>x.classList.remove('on'));document.getElementById(id).classList.add('on');[...nav.children].forEach((b,i)=>b.className=tabs[i]===id?'':'off');render()}
function save(){localStorage.setItem(K,JSON.stringify(db));render()}
function itemLabel(x){return ING[x.key]?.[lang]||x.name}
function addItem(){if(!pname.value.trim()||!qty.value)return;let key=canon(pname.value),existing=db.items.find(x=>x.key===key&&x.zone===zone.value&&x.unit===unit.value);if(existing)existing.qty=+(existing.qty+(+qty.value)).toFixed(2);else db.items.push({id:crypto.randomUUID(),name:pname.value.trim(),key,zone:zone.value,qty:+qty.value,unit:unit.value,purchase:purchase.value||new Date().toISOString().slice(0,10),expiry:expiry.value});pname.value=qty.value=expiry.value='';save()}
function stockFor(a){let [key,need,unitNeed]=a;return db.items.find(x=>x.key===key && x.unit===unitNeed && x.qty>=need)}
function missing(r){return r.ing.filter(a=>!stockFor(a))}
function matchedCount(r){return r.ing.filter(a=>db.items.some(x=>x.key===a[0]&&x.qty>0)).length}
function useRecipe(i){let r=recipes[i];if(missing(r).length)return;r.ing.forEach(a=>{let x=db.items.find(z=>z.key===a[0]&&z.unit===a[2]);if(x){x.qty=Math.max(0,+(x.qty-a[1]).toFixed(2));db.shopping.push({key:a[0],qty:a[1],unit:a[2]})}});save()}
function card(r,i,idea=false){let m=missing(r),nm=lang==='he'?r.he:r.fr;return `<div class="recipe"><div class="recipe-title">${nm}</div><div class="meta"><span class="pill">${tr(r.k)}</span>${m.length?`<span class="pill warn">${tr('missing')} ${m.length}</span>`:`<span class="pill ok">${tr('possible')}</span>`}</div><div class="muted">${r.ing.map(a=>`${ingLabel(a[0])} ${a[1]} ${T[lang][a[2]]||a[2]}`).join(' • ')}</div>${!m.length?`<button style="margin-top:8px" onclick="useRecipe(${i})">${tr('made')}</button>`:''}<div class="source"><b>${tr('source')}:</b> ${r.src}${r.url?` · <a href="${r.url}" target="_blank" rel="noopener">${tr('original')}</a>`:''}</div></div>`}
function renderRecipes(){recipeList.innerHTML='';recipes.forEach((r,i)=>{let m=missing(r);if(kf.value!=='all'&&r.k!==kf.value)return;if(rf.value==='possible'&&m.length)return;if(rf.value==='one'&&m.length!==1)return;recipeList.insertAdjacentHTML('beforeend',card(r,i))});if(!recipeList.innerHTML)recipeList.textContent=tr('none');sources.innerHTML=sourcesData.map(s=>`<div><a href="${s[1]}" target="_blank">${s[0]}</a></div>`).join('')}
function days(d){return d?Math.ceil((new Date(d)-new Date())/86400000):null}
function renderStock(){stockBody.innerHTML=db.items.map(x=>`<tr><td>${itemLabel(x)}</td><td>${tr(x.zone)}</td><td>${x.qty} ${T[lang][x.unit]||x.unit}</td><td>${x.expiry||'—'}</td></tr>`).join('');stockMobile.innerHTML=db.items.map(x=>`<div class="stock-item"><b>${itemLabel(x)}</b><div class="muted">${tr(x.zone)} · ${x.qty} ${T[lang][x.unit]||x.unit}${x.expiry?' · '+x.expiry:''}</div></div>`).join('')}
function render(){summary.innerHTML=`🧊 ${tr('fridge')}: ${db.items.filter(x=>x.zone==='fridge').length}<br>❄️ ${tr('freezer')}: ${db.items.filter(x=>x.zone==='freezer').length}<br>🥫 ${tr('pantry')}: ${db.items.filter(x=>x.zone==='pantry').length}`;let e=db.items.filter(x=>days(x.expiry)!==null&&days(x.expiry)<=5);soon.innerHTML=e.length?e.map(x=>`<div>${itemLabel(x)} <span class="pill ${days(x.expiry)<=2?'bad':'warn'}">${days(x.expiry)}j</span></div>`).join(''):tr('none');let poss=recipes.map((r,i)=>[r,i]).filter(x=>missing(x[0]).length===0);homeRecipes.innerHTML=poss.length?poss.map(x=>card(x[0],x[1])).join(''):tr('none');let ideas=recipes.map((r,i)=>({r,i,score:matchedCount(r),miss:missing(r).length})).filter(x=>x.score>0&&x.miss>0).sort((a,b)=>b.score-a.score||a.miss-b.miss).slice(0,5);smartIdeas.innerHTML=ideas.length?ideas.map(x=>card(x.r,x.i,true)).join(''):tr('none');shoppingList.innerHTML=db.shopping.length?db.shopping.map(x=>`<li>${ingLabel(x.key)} — ${x.qty} ${T[lang][x.unit]||x.unit}</li>`).join(''):`<li>${tr('none')}</li>`;renderStock();renderRecipes()}
async function scan(){let f=img.files[0];if(!f)return;status.textContent=lang==='he'?'קורא…':'Lecture…';try{let r=await Tesseract.recognize(f,'heb+eng');txt.value=r.data.text;status.textContent='OK'}catch(e){status.textContent='OCR error'}}
function parseTicket(){let lines=txt.value.split('\n').filter(Boolean);ticketResults.innerHTML=lines.slice(0,40).map(l=>`<div class="muted">${l}</div>`).join('')}
apply();render();
</script></body></html>
