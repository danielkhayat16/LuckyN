tegories.innerHTML='';Object.entries(T[lang].categories).forEach(([key,v])=>{let count=RECIPES.filter(r=>r.tags.includes(key)&&allowed(r)).length;let b=document.createElement('button');b.className='cat';b.innerHTML=`<span class="emoji">${v[0]}</span><strong>${v[1]}</strong><span class="muted">${count} ${lang==='he'?'מתכונים מתאימים':'recettes adaptées'}</span>`;b.onclick=()=>openCategory(key);categories.appendChild(b)})}function showCategories(){currentCategory=null;recipeCategories.classList.remove('hidden');categoryView.classList.add('hidden');recipeDetail.classList.add('hidden');renderCategories()}function openCategory(key){currentCategory=key;recipeCategories.classList.add('hidden');categoryView.classList.remove('hidden');recipeDetail.classList.add('hidden');categoryTitle.textContent=T[lang].categories[key][1];let list=RECIPES.filter(r=>r.tags.includes(key)&&allowed(r));let now=list.filter(r=>missing(r).length===0),one=list.filter(r=>missing(r).length===1);categoryContent.innerHTML=`<h4>${tr('possible')}</h4>${now.length?now.map(r=>recipeCard(r)).join(''):`<p class="muted">${tr('none')}</p>`}<h4 style="margin-top:18px">${tr('missing')}</h4>${one.length?one.map(r=>recipeCard(r)).join(''):`<p class="muted">${tr('none')}</p>`}`}function backToCategory(){if(currentCategory)openCategory(currentCategory);else showCategories()}function folderSelect(r){let opts=db.folders.map(f=>`<option value="${f}">${f}</option>`).join('');return `<div class="savebar"><select id="folderPick">${opts}</select><button onclick="saveRecipe('${r.id}')">${db.saved[r.id]?tr('savedOk'):tr('save')}</button></div>`}function openRecipe(id,fromSaved=false){let r=RECIPES.find(x=>x.id===id);if(!r)return;if(fromSaved){go('recipes')}recipeCategories.classList.add('hidden');categoryView.classList.add('hidden');recipeDetail.classList.remove('hidden');let miss=missing(r);detailContent.innerHTML=`<div class="detail-hero"><h2>${r[lang]}</h2><span class="pill">${r.time} ${tr('minutes')}</span><span class="pill">${r.servings} ${tr('servings')}</span>${miss.length===0?`<span class="pill ok">${tr('possible')}</span>`:`<span class="pill warn">${miss.length} ${lang==='he'?'מרכיבים חסרים':'ingrédients manquants'}</span>`}${folderSelect(r)}</div><div class="card"><h3>${tr('ingredients')}</h3>${r.ing.map(a=>`<div class="ingredient-row"><span>${label(a[0])}</span><span class="${hasIng(a)?'have':'missing'}">${a[1]} ${T[lang][a[2]]||a[2]} ${hasIng(a)?'✓':'!'}</span></div>`).join('')}${miss.length?`<button style="margin-top:12px" onclick="addMissing('${r.id}')">${tr('addMissing')}</button>`:''}</div><div class="card"><h3>${tr('steps')}</h3><div class="steps">${(lang==='he'?r.stepsHe:r.stepsFr).map(s=>`<div class="step">${s}</div>`).join('')}</div><div class="source"><b>${tr('source')}:</b> ${r.src}</div></div>`}function saveRecipe(id){let f=document.getElementById('folderPick').value;db.saved[id]=f;if(!db.folders.includes(f))db.folders.push(f);save();openRecipe(id)}function addFolder(){let f=newFolder.value.trim();if(!f)return;if(!db.folders.includes(f))db.folders.push(f);newFolder.value='';save();renderSaved()}function addMissing(id){let r=RECIPES.find(x=>x.id===id);missing(r).forEach(a=>{let e=db.shopping.find(x=>x.key===a[0]&&x.unit===a[2]);if(e)e.qty=Math.max(e.qty,a[1]);else db.shopping.push({key:a[0],qty:a[1],unit:a[2]})});save();openRecipe(id)}function renderSaved(){let html='';db.folders.forEach(f=>{let rs=RECIPES.filter(r=>db.saved[r.id]===f);html+=`<div class="card"><h3>${f}</h3>${rs.length?rs.map(r=>recipeCard(r,true)).join(''):`<p class="muted">${tr('none')}</p>`}</div>`});savedFolders.innerHTML=html}function render(){summary.innerHTML=`🧊 ${tr('fridge')}: ${db.items.filter(x=>x.zone==='fridge').length}<br>❄️ ${tr('freezer')}: ${db.items.filter(x=>x.zone==='freezer').length}<br>🥫 ${tr('pantry')}: ${db.items.filter(x=>x.zone==='pantry').length}`;soon.textContent=tr('none');let possible=RECIPES.filter(r=>missing(r).length===0).slice(0,4);cookNow.innerHTML=possible.length?possible.map(r=>recipeCard(r)).join(''):tr('none');inventory.innerHTML=db.items.length?db.items.map(x=>`<div class="recipe-card"><b>${label(x.key)}</b><div class="muted">${tr(x.zone)} · ${x.qty} ${T[lang][x.unit]||x.unit}</div></div>`).join(''):tr('none');shopping.innerHTML=db.shopping.length?db.shopping.map(x=>`<li>${label(x.key)} — ${x.qty} ${T[lang][x.unit]||x.unit}</li>`).join(''):`<li>${tr('none')}</li>`;familyInfo.innerHTML=profile?`<p><b>${profile.family}</b></p><p>${profile.adults} ${lang==='he'?'מבוגרים':'adultes'} · ${profile.kids} ${lang==='he'?'ילדים':'enfants'}</p>`:'';syncNote.textContent=tr('sync');renderCategories();renderSaved()}if(!profile)onboard.classList.add('show');apply();render();</script></body></html>
